icons_format = "{icon}"

[theme]
theme = "space-villain"

[icons]
icons = "awesome6"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90
[[block.click]]
button = "left"
cmd = "alacritty -e btop"

#[[block]]
#block = "disk_space"
#path = "/"
#info_type = "available"
#alert_unit = "GB"
#interval = 20
#warning = 20.0
#alert = 10.0
#format = " $icon root: $available.eng(w:2) "

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "
interval= 4
warning_mem = 70
critical_mem = 90

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "backlight"
invert_icons = false

[[block]]
block = "battery"
format = " $icon $percentage "

[[block]]
block = "custom"
command = "persian_date"
interval = 60

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%a %R:%S') "

[[block]]
block = "keyboard_layout"
driver = "setxkbmap"
format = " $layout "

[[block]]
block = "net"
format = "$speed_down.eng(w:4)"
[[block.click]]
button = "left"
cmd = "nm-connection-editor"

